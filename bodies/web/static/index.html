<!doctype html>
<html lang="en" data-aura-state="observing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURA</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-vignette"></div>
<div class="scanlines"></div>

<header class="hud">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">AURA</span>
    <span class="brand-sub">cognitive core</span>
  </div>
  <div class="hud-right">
    <span class="chip" id="state-chip">observing</span>
    <span class="chip chip-dim" id="link-chip" data-link="down">link · offline</span>
  </div>
</header>

<main class="stage">
  <div>
    <div class="orb-wrap" id="orb-wrap">
      <canvas id="orb" title="Click to speak"></canvas>
    </div>
    <div class="orb-hint" id="orb-hint">
      click the core, or press <kbd>enter</kbd>, to speak &nbsp;·&nbsp; <kbd>c</kbd> for camera
    </div>
  </div>
</main>

<aside class="camera-panel" id="camera-panel" aria-hidden="true">
  <div class="cam-frame">
    <img id="cam-feed" alt="AURA's live camera feed">
    <canvas id="cam-mock" hidden></canvas>
    <div class="cam-empty" id="cam-empty" hidden>no feed</div>
    <div class="cam-scan"></div>
    <div class="cam-corner tl"></div>
    <div class="cam-corner tr"></div>
    <div class="cam-corner bl"></div>
    <div class="cam-corner br"></div>
    <div class="cam-label">
      <span class="rec-dot"></span>
      <span id="cam-id">web-01</span>
      <span class="cam-dim" id="cam-res">640×480</span>
      <span class="cam-dim" id="cam-fps">— fps</span>
    </div>
  </div>
</aside>

<footer class="caption">
  <div class="caption-row">
    <span class="caption-key">YOU</span>
    <span class="caption-text" id="you-text">—</span>
    <span class="caption-controls">
      <button class="ctl" id="btn-talk" type="button">talk</button>
      <button class="ctl" id="btn-cam" type="button" aria-pressed="false">camera</button>
    </span>
  </div>
  <div class="caption-row">
    <span class="caption-key">AURA</span>
    <span class="caption-text aura" id="aura-text">—</span>
  </div>
  <div class="caption-row ambient-row">
    <span class="caption-key">AMBIENT</span>
    <span class="caption-text" id="ambient-text">—</span>
    <span class="caption-tag" id="ambient-tag" hidden>suppressed</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="orb.js"></script>
<script src="app.js"></script>
</body>
</html>
